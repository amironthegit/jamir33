name: Update V2Ray Configs

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Restore state
        run: |
          mkdir -p source/output
          if [ -f gh-pages/meta.json ]; then
            cp gh-pages/meta.json source/output/meta.json
            echo "Restored meta"
          else
            echo "First run"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scraper
        working-directory: source
        run: python src/scraper.py

     

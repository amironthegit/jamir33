name: Update V2Ray Configs

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Restore state
        run: |
          mkdir -p source/output
          if [ -f gh-pages/meta.json ]; then
            cp gh-pages/meta.json source/output/meta.json
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scraper
        working-directory: source
        run: python src/scraper.py

      - name: Deploy to gh-pages
        working-directory: source
        run: |
          test -f output/sub.txt || exit 0
          cd ../gh-pages || mkdir -p ../gh-pages && cd ../gh-pages
          if [ ! -d .git ]; then
            git init
            git checkout --orphan gh-pages
          else
            git checkout gh-pages || git checkout --orphan gh-pages
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp ../source/output/sub.txt .
          cp ../source/output/meta.json .
          cp ../source/output/index.html .
          git add sub.txt meta.json index.html
          git diff --cached --quiet || git commit -m "Update configs"
          git push origin gh-pages --force

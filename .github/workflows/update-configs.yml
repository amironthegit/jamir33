name: Update V2Ray Configs

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore previous state
        run: |
          mkdir -p source/output
          git fetch origin gh-pages 2>/dev/null || true
          git show origin/gh-pages:meta.json > source/output/meta.json 2>/dev/null || echo "First run - no previous state"

      - name: Run scraper
        working-directory: source
        run: python src/scraper.py

      - name: Deploy to gh-pages
        run: |
          if [ ! -f source/output/sub.txt ]; then
            echo "No update needed"
            exit 0
          fi

          # ساخت پوشه deploy مجزا
          mkdir -p deploy
          cp source/output/sub.txt deploy/
          cp source/output/meta.json deploy/
          cp source/output/index.html deploy/

          cd deploy
          git init
          git checkout --orphan gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update configs"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin gh-pages --force

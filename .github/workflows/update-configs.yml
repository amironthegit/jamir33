name: Update V2Ray Configs

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download previous state
        run: |
          mkdir -p output
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/gh-pages"
          curl -sf -o output/meta.json "$BASE/meta.json" || echo "{}" > output/meta.json
          if ! curl -sf -o /dev/null "$BASE/sub.txt"; then
            echo "sub.txt missing on Pages - resetting state for full rebuild"
            rm -f output/meta.json
          fi
          echo "Current meta.json:"
          cat output/meta.json 2>/dev/null || echo "(none)"

      - name: Run stealth scraper
        run: python src/scraper.py

      - name: Deploy to GitHub Pages
        if: hashFiles('output/sub.txt') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true

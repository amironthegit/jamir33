name: Update V2Ray Configs

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore previous state
        run: |
          mkdir -p output
          git fetch origin gh-pages 2>/dev/null || true
          git show origin/gh-pages:meta.json > output/meta.json 2>/dev/null || echo "First run"

      - name: Run scraper
        run: python src/scraper.py

      - name: Deploy to GitHub Pages
        if: hashFiles('output/sub.txt') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Update configs"

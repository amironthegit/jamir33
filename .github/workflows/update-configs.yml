name: Update V2Ray Configs

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # دانلود امن فایل قبلی بدون درگیری با git
      - name: Download previous state
        run: |
          mkdir -p output
          curl -s -o output/meta.json https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/meta.json || echo "{}" > output/meta.json
          echo "Current meta.json:"
          cat output/meta.json

      - name: Run stealth scraper
        run: python src/scraper.py

      # دیپلوی بی‌دردسر با اکشن رسمی
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true
